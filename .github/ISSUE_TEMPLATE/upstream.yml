name: 上游协议变更
description: Qoder 客户端/CLI 更新后插件失效、模型目录异常、签名/版本门报错
title: "[Upstream] "
labels: ["upstream"]
body:
  - type: markdown
    attributes:
      value: |
        上游变更类 issue 最需要的是「版本 + 原始错误 + 诊断页结果」。
        请先确认：Qoder 官方客户端在同一时间、同一账号下是否正常。
  - type: input
    id: versions
    attributes:
      label: Qoder 客户端 / CLI / 插件版本
      placeholder: "Qoder 0.5.x · qodercli 1.1.x · qoder-to-dsh 1.6.x"
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: 现象与原始报错
      description: 例如 430、401、签名 101、模型列表为空、签到活动不返回。
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断页「COSY 协议版本 / 模型目录 / 凭据加密」三项
      description: 直接复制这三项的 detail 即可；诊断包更完整。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认官方客户端在同一时间可用
          required: true
        - label: 我已尝试完全退出并重开 dsh
          required: true
        - label: 我已移除 token、cookie、完整邮箱/uid
          required: true
